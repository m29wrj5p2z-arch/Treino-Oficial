<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Treino" />
  <title>Treino</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    body{background:#0f0f13;color:#f0ede8;font-family:'DM Sans',sans-serif;min-height:100vh;padding-bottom:100px;padding-top:env(safe-area-inset-top)}
    button{font-family:'DM Sans',sans-serif;cursor:pointer}
    input{font-family:'DM Sans',sans-serif}
    .header{background:linear-gradient(180deg,#1a1a22 0%,#0f0f13 100%);border-bottom:1px solid #2a2a35;padding:28px 20px 20px}
    .header-inner{max-width:480px;margin:0 auto}
    .label-small{font-size:11px;letter-spacing:.15em;color:#888;text-transform:uppercase;margin-bottom:4px}
    .title{font-family:'Barlow Condensed',sans-serif;font-size:32px;font-weight:700}
    .week-toggle{display:flex;gap:8px;margin-top:16px}
    .week-btn{padding:6px 16px;border-radius:20px;border:1px solid;font-size:12px;font-weight:600;letter-spacing:.05em;background:transparent;transition:all .2s}
    .content{max-width:480px;margin:0 auto;padding:0 16px}
    .week-strip{display:flex;gap:6px;padding:16px 0;overflow-x:auto;scrollbar-width:none}
    .week-strip::-webkit-scrollbar{display:none}
    .day-col{flex:0 0 auto;width:54px;text-align:center}
    .day-label{font-size:10px;color:#666;margin-bottom:6px;letter-spacing:.08em}
    .day-icon{width:44px;height:44px;border-radius:12px;margin:0 auto;display:flex;align-items:center;justify-content:center;transition:all .2s;border:1.5px solid}
    .day-name{font-size:9px;color:#888;margin-top:5px;line-height:1.2}
    .tabs{display:flex;gap:8px;margin-bottom:20px}
    .tab-btn{flex:1;padding:10px 4px;border-radius:12px;border:1.5px solid;font-size:11px;font-weight:600;letter-spacing:.04em;transition:all .2s}
    .progress-wrap{margin-bottom:20px}
    .progress-header{display:flex;justify-content:space-between;font-size:12px;color:#888;margin-bottom:8px}
    .progress-bar-bg{height:4px;background:#2a2a35;border-radius:4px;overflow:hidden}
    .progress-bar-fill{height:100%;border-radius:4px;transition:width .4s ease}
    .exercises{display:flex;flex-direction:column;gap:12px}
    .ex-card{border-radius:14px;border:1px solid;overflow:hidden;transition:border-color .2s}
    .ex-header{padding:14px 16px;cursor:pointer;display:flex;align-items:flex-start;gap:12px}
    .checkbox{width:22px;height:22px;border-radius:7px;border:2px solid;flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;transition:all .2s;font-size:12px;color:#fff}
    .ex-body{flex:1}
    .ex-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
    .ex-name{font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:700;letter-spacing:.02em}
    .ex-sets-badge{border-radius:8px;padding:2px 8px;font-size:11px;font-weight:600;white-space:nowrap;letter-spacing:.04em;border:1px solid}
    .ex-note{font-size:12px;color:#888;margin-bottom:4px}
    .ex-tip{font-size:11px;color:#555;background:rgba(255,255,255,.03);border-radius:8px;padding:6px 10px;line-height:1.5}
    .sets-panel{padding:0 16px 14px 50px;display:flex;flex-direction:column;gap:8px}
    .set-row{display:flex;align-items:center;gap:8px}
    .set-num{font-size:11px;color:#666;font-weight:600;width:20px;flex-shrink:0;letter-spacing:.04em}
    .set-input-wrap{display:flex;align-items:center;gap:6px;flex:1}
    .set-input{background:#252530;border:1px solid #333;border-radius:8px;color:#f0ede8;font-size:14px;font-weight:600;padding:7px 10px;width:100%;text-align:center;outline:none;transition:border-color .2s}
    .set-input:focus{border-color:#555}
    .set-input::placeholder{color:#444;font-weight:400;font-size:13px}
    .set-divider{font-size:12px;color:#555}
    .set-done-btn{width:32px;height:32px;border-radius:8px;border:1.5px solid;background:transparent;font-size:14px;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0}
    .set-logged{background:#1a1a22;border-radius:8px;padding:6px 10px;font-size:12px;color:#888;display:flex;justify-content:space-between;align-items:center}
    .set-logged-vals{font-weight:600;font-size:13px}
    .set-edit-btn{font-size:11px;color:#555;background:none;border:none;padding:2px 6px;border-radius:4px}
    .done-card{margin-top:20px;border-radius:14px;padding:16px;text-align:center;border:1px solid}
    .done-emoji{font-size:24px;margin-bottom:6px}
    .done-title{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:700}
    .done-sub{font-size:12px;color:#888;margin-top:4px}
    .new-badge{font-size:9px;font-weight:700;letter-spacing:.06em;padding:2px 5px;border-radius:4px;margin-left:6px;vertical-align:middle;background:#e8a82f22;color:#e8a82f;border:1px solid #e8a82f44}
  </style>
</head>
<body>
<div id="app"></div>
<script>
const workouts = {
  legs: { id:"legs", label:"Inferior", emoji:"🦵", color:"#e85d2f", exercises:[
    { name:"Romanian Deadlift", sets:3, reps:"5–10", note:"Máquina: 20kg", tip:"Quadril para frente ao subir, para trás ao descer. Mantenha as costas neutras." },
    { name:"Smith Squat", sets:3, reps:"5–10", note:"Rack: 80kg", tip:"Joelhos alinhados com os pés, desça até 90°." },
    { name:"Seated Leg Curl", sets:3, reps:"10–15", note:"Máquina: 195", tip:"Controle a descida, não solte o peso." },
    { name:"Leg Extension", sets:3, reps:"10–15", note:"Nova máquina: 100kg", tip:"Segure 1s no topo de cada repetição." },
    { name:"Standing Calf Raise", sets:4, reps:"10–15", note:"50 / 120lbs / 190 sentado", tip:"Vai até o topo e desce devagar. Amplitude total." },
    { name:"Seated Calf Raise", sets:3, reps:"10–15", note:"Novo — foco no sóleo", tip:"Fibra diferente do em pé. Peso moderado, amplitude total.", isNew:true },
    { name:"Leg Press (Adutores)", sets:3, reps:"10–15", note:"Novo — pés juntos no centro", tip:"Pés juntos e no centro da plataforma. Ativa adutores e vasto medial.", isNew:true },
  ]},
  upperA: { id:"upperA", label:"Superior A", emoji:"💪", color:"#2f7fe8", exercises:[
    { name:"Incline Smith Press", sets:2, reps:"6–8", note:"Smith: 35kg | Halteres: 26kg", tip:"Cotovelos a ~45° do tronco. Desça devagar, exploda na subida." },
    { name:"Pec Deck", sets:2, reps:"6–8", note:"87,5", tip:"Esprema no centro, não deixe os cotovelos passarem o plano do ombro." },
    { name:"Lateral Raises", sets:3, reps:"8–10", note:"17,5kg", tip:"Cotovelo ligeiramente dobrado, sobe até a altura do ombro. Controle na descida." },
    { name:"Pull-ups (lastrado)", sets:3, reps:"6–8", note:"Cinto de peso ou haltere entre as pernas", tip:"Escápulas ativas antes de puxar. Carga suficiente pra falhar entre 6–8.", isNew:true },
    { name:"Low Row", sets:2, reps:"6–8", note:"2 placas grandes | Máquina: 80kg", tip:"Cotovelos rentes ao tronco. Aperte a escápula no final do movimento." },
    { name:"Preacher Curl", sets:3, reps:"6–8", note:"45kg + 2", tip:"Não balance o tronco. Controle total na descida." },
    { name:"Incline Curl", sets:2, reps:"8–10", note:"Novo — bíceps alongado", tip:"Banco inclinado a ~45°. Posição alongada é onde mais cresce.", isNew:true },
    { name:"Tricep Pushdown", sets:2, reps:"6–8", note:"36,5 no espelho", tip:"Cotovelos fixos ao lado do corpo. Trave no final." },
  ]},
  upperB: { id:"upperB", label:"Superior B", emoji:"🏋️", color:"#2fb87e", exercises:[
    { name:"Chest Press", sets:3, reps:"6–8", note:"100", tip:"Controle a descida em 2–3s. Exploda na subida." },
    { name:"Pulldown Fechado", sets:2, reps:"6–8", note:"2 placas grandes | Máquina pulldown: 77kg", tip:"Puxe até o queixo, cuidado para não abrir os cotovelos." },
    { name:"T-Bar Row", sets:2, reps:"6–8", note:"50kg", tip:"Tronco a ~45°, costas neutras. Puxe com o cotovelo, não com a mão." },
    { name:"Shoulder Press", sets:2, reps:"6–8", note:"Máquina: 100 | Anilha: 40kg", tip:"Não hiperestenda o pescoço. Desça até 90° nos cotovelos." },
    { name:"Posterior de Ombro", sets:3, reps:"8–10", note:"45kg + 2", tip:"Face pull ou voador invertido. Foco na escápula, não no trapézio." },
    { name:"Bíceps Halter", sets:3, reps:"6–8", note:"20kg", tip:"Supinação completa no topo. Sem balanço." },
    { name:"Spider Curl", sets:2, reps:"8–10", note:"Novo — bíceps alongado", tip:"Banco inclinado virado pra frente. Máxima tensão no alongamento.", isNew:true },
    { name:"Tríceps Francês", sets:2, reps:"6–8", note:"Registra o peso aqui!", tip:"Cotovelos apontando para cima, sem abrir. Extensão completa." },
  ]},
  run: { id:"run", label:"Corrida", emoji:"🏃", color:"#c94fd8", exercises:[
    { name:"Aquecimento", sets:1, reps:"5 min", note:"Caminhada ou trote leve", tip:"Aumenta o fluxo sanguíneo gradualmente." },
    { name:"Corrida Contínua", sets:1, reps:"20–30 min", note:"Ritmo conversacional (zona 2)", tip:"Você deve conseguir falar frases curtas enquanto corre. Se não conseguir, diminua o ritmo." },
    { name:"Desaquecimento", sets:1, reps:"5 min", note:"Trote leve → caminhada", tip:"Não pare de repente. Baixe o ritmo gradualmente." },
    { name:"Alongamento", sets:1, reps:"5–10 min", note:"Panturrilha, quadríceps, isquiotibiais e quadril", tip:"Segure cada posição por 20–30s. Respire fundo." },
  ]},
};

const weekPlan = [
  {day:"Seg",wid:"legs"},{day:"Ter",wid:"upperA"},{day:"Qua",wid:"run"},
  {day:"Qui",wid:null},{day:"Sex",wid:"legs"},{day:"Sáb",wid:"upperB"},{day:"Dom",wid:null},
];

// State
let state = {
  selected:"legs",
  week:"A",
  expanded:{},   // exId -> bool (sets panel open)
  done:{},       // "workout-exIdx" -> bool
  logs:{},       // "workout-exIdx-setIdx" -> {kg, reps}
  inputs:{},     // "workout-exIdx-setIdx-kg/reps" -> string (live input)
};

function wkey(exIdx,setIdx,field){ return `${state.selected}-${exIdx}-${setIdx}-${field}`; }
function dkey(exIdx){ return `${state.selected}-${exIdx}`; }
function logkey(exIdx,setIdx){ return `${state.selected}-${exIdx}-${setIdx}`; }
function exkey(exIdx){ return `${state.selected}-${exIdx}`; }

function resolveId(wid){ return (!wid)?null:(wid==="upperA"||wid==="upperB")?`upper${state.week}`:wid; }

function allSetsLogged(exIdx){
  const w=workouts[state.selected];
  const ex=w.exercises[exIdx];
  for(let s=0;s<ex.sets;s++){ if(!state.logs[logkey(exIdx,s)]) return false; }
  return true;
}

function completedCount(){
  const w=workouts[state.selected];
  return w.exercises.filter((_,i)=>allSetsLogged(i)).length;
}

function render(){
  const {selected,week,expanded,done,logs,inputs}=state;
  const workout=workouts[selected];
  const comp=completedCount();

  let html=`
  <div class="header"><div class="header-inner">
    <div class="label-small">Academia</div>
    <div class="title">Plano Semanal</div>
    <div class="week-toggle">
      <button class="week-btn" id="btnA" style="border-color:${week==="A"?workouts.upperA.color:"#333"};color:${week==="A"?workouts.upperA.color:"#666"};background:${week==="A"?workouts.upperA.color+"22":"transparent"}">SEMANA A</button>
      <button class="week-btn" id="btnB" style="border-color:${week==="B"?workouts.upperB.color:"#333"};color:${week==="B"?workouts.upperB.color:"#666"};background:${week==="B"?workouts.upperB.color+"22":"transparent"}">SEMANA B</button>
    </div>
  </div></div>
  <div class="content">
    <div class="week-strip">`;

  weekPlan.forEach(({day,wid})=>{
    const rid=resolveId(wid);
    const w=rid?workouts[rid]:null;
    const isRest=!w;
    const isActive=w&&selected===rid;
    html+=`<div class="day-col"${w?` data-sel="${rid}"`:""} style="cursor:${w?"pointer":"default"}">
      <div class="day-label">${day}</div>
      <div class="day-icon" style="background:${isRest?"#1a1a22":(isActive?w.color:w?.color+"22")};border-color:${isRest?"#2a2a35":(isActive?w.color:w?.color+"55")};font-size:${isRest?"14px":"18px"}">${isRest?"—":w.emoji}</div>
      <div class="day-name" style="color:${isRest?"#444":"#888"}">${isRest?"Descanso":w.label}</div>
    </div>`;
  });

  html+=`</div><div class="tabs">`;
  [`legs`,`upper${week}`,`run`].forEach(id=>{
    const w=workouts[id];
    const active=selected===id;
    html+=`<button class="tab-btn" data-sel="${id}" style="border-color:${active?w.color:"#2a2a35"};background:${active?w.color+"18":"#1a1a22"};color:${active?w.color:"#666"}">${w.emoji} ${w.label}</button>`;
  });

  html+=`</div>
  <div class="progress-wrap">
    <div class="progress-header"><span>Progresso</span><span style="color:${workout.color};font-weight:600">${comp}/${workout.exercises.length}</span></div>
    <div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${(comp/workout.exercises.length)*100}%;background:${workout.color}"></div></div>
  </div>
  <div class="exercises">`;

  workout.exercises.forEach((ex,ei)=>{
    const allDone=allSetsLogged(ei);
    const isOpen=expanded[exkey(ei)];
    html+=`<div class="ex-card" style="border-color:${allDone?workout.color+"55":"#2a2a35"};background:${allDone?workout.color+"08":"#1a1a22"}">
      <div class="ex-header" data-toggle="${ei}">
        <div class="checkbox" style="border-color:${allDone?workout.color:"#444"};background:${allDone?workout.color:"transparent"}">${allDone?"✓":""}</div>
        <div class="ex-body">
          <div class="ex-top">
            <div class="ex-name" style="color:${allDone?"#666":"#f0ede8"};text-decoration:${allDone?"line-through":"none"}">${ex.name}${ex.isNew?`<span class="new-badge">NOVO</span>`:""}</div>
            <div class="ex-sets-badge" style="background:${workout.color+"22"};border-color:${workout.color+"44"};color:${workout.color}">${ex.sets}×${ex.reps}</div>
          </div>
          <div class="ex-note">📊 ${ex.note}</div>
          <div class="ex-tip">💡 ${ex.tip}</div>
        </div>
      </div>`;

    if(isOpen){
      html+=`<div class="sets-panel">`;
      for(let s=0;s<ex.sets;s++){
        const lk=logkey(ei,s);
        const logged=logs[lk];
        if(logged){
          html+=`<div class="set-logged">
            <span style="color:#666;font-size:11px">Série ${s+1}</span>
            <span class="set-logged-vals" style="color:${workout.color}">${logged.kg}kg × ${logged.reps} reps</span>
            <button class="set-edit-btn" data-edit="${ei}-${s}">editar</button>
          </div>`;
        } else {
          const kgVal=inputs[wkey(ei,s,"kg")]||"";
          const repsVal=inputs[wkey(ei,s,"reps")]||"";
          html+=`<div class="set-row">
            <div class="set-num">S${s+1}</div>
            <div class="set-input-wrap">
              <input class="set-input" type="number" inputmode="decimal" placeholder="kg" value="${kgVal}" data-inp="${ei}-${s}-kg" style="max-width:70px" />
              <div class="set-divider">×</div>
              <input class="set-input" type="number" inputmode="numeric" placeholder="reps" value="${repsVal}" data-inp="${ei}-${s}-reps" style="max-width:70px" />
            </div>
            <button class="set-done-btn" data-log="${ei}-${s}" style="border-color:${workout.color};color:${workout.color}">✓</button>
          </div>`;
        }
      }
      html+=`</div>`;
    }

    html+=`</div>`;
  });

  html+=`</div>`;

  if(comp===workout.exercises.length){
    html+=`<div class="done-card" style="background:${workout.color+"18"};border-color:${workout.color+"44"}">
      <div class="done-emoji">🔥</div>
      <div class="done-title" style="color:${workout.color}">Treino finalizado!</div>
      <div class="done-sub">Bom trabalho. Descansa bem.</div>
    </div>`;
  }

  html+=`</div>`;
  document.getElementById("app").innerHTML=html;

  // Events
  document.getElementById("btnA").onclick=()=>{ state.week="A"; state.selected="upperA"; state.expanded={}; render(); };
  document.getElementById("btnB").onclick=()=>{ state.week="B"; state.selected="upperB"; state.expanded={}; render(); };

  document.querySelectorAll("[data-sel]").forEach(el=>{
    el.onclick=()=>{ state.selected=el.dataset.sel; state.expanded={}; render(); };
  });

  document.querySelectorAll("[data-toggle]").forEach(el=>{
    el.onclick=()=>{
      const ei=el.dataset.toggle;
      state.expanded[exkey(ei)]=!state.expanded[exkey(ei)];
      render();
    };
  });

  document.querySelectorAll("[data-inp]").forEach(el=>{
    el.oninput=()=>{ state.inputs[`${state.selected}-${el.dataset.inp}`]=el.value; };
  });

  document.querySelectorAll("[data-log]").forEach(el=>{
    el.onclick=()=>{
      const [ei,si]=el.dataset.log.split("-");
      const kg=state.inputs[wkey(ei,si,"kg")];
      const reps=state.inputs[wkey(ei,si,"reps")];
      if(!kg||!reps) { el.style.transform="scale(1.2)"; setTimeout(()=>el.style.transform="",200); return; }
      state.logs[logkey(ei,si)]={kg,reps};
      render();
    };
  });

  document.querySelectorAll("[data-edit]").forEach(el=>{
    el.onclick=(e)=>{
      e.stopPropagation();
      const [ei,si]=el.dataset.edit.split("-");
      delete state.logs[logkey(ei,si)];
      render();
    };
  });
}

render();
</script>
</body>
</html>
